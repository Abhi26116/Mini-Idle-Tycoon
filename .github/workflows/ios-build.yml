name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and test on iOS Simulator
        run: |
          # Use whichever iPhone simulator this runner's Xcode ships with.
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in d.items() if "iOS" in r for x in v if "iPhone" in x["name"]))')
          xcodebuild test \
            -project MiniIdleTycoon.xcodeproj \
            -scheme MiniIdleTycoon \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
